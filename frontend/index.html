<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO: 검색결과에 뜨는 제목/설명 -->
    <title>DEV 블로그</title>
    <meta name="description" content="개발과 인프라를 기록하는 블로그. 글 작성·구독·AI 초안까지 직접 만든 풀스택 사이트." />

    <!-- Open Graph: 카카오톡·페이스북 등에 링크 공유 시 미리보기 카드 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DEV 블로그" />
    <meta property="og:title" content="DEV 블로그" />
    <meta property="og:description" content="개발과 인프라를 기록하는 블로그. 글 작성·구독·AI 초안까지 직접 만든 풀스택 사이트." />
    <meta property="og:url" content="https://d2j66m9udyg9yq.cloudfront.net/" />
    <meta property="og:image" content="https://d2j66m9udyg9yq.cloudfront.net/og-image.png" />
    <!-- 크기를 함께 준다. 없으면 크롤러가 그림을 받아보기 전까지 카드 모양을 못 정해
         '큰 카드'로 뜰지 판단이 늦거나 작은 카드로 떨어진다.
         그림은 scripts/gen_og_image.py가 만든다(1200x630 — 2026-08-12 이전엔 343x361이라
         큰 카드 기준에 미달했다). 값을 고치려면 그 스크립트를 고쳐 다시 만들 것. -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DEV 블로그" />
    <meta property="og:locale" content="ko_KR" />

    <!-- Twitter 카드 -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DEV 블로그" />
    <meta name="twitter:description" content="개발과 인프라를 기록하는 블로그. 글 작성·구독·AI 초안까지 직접 만든 풀스택 사이트." />
    <meta name="twitter:image" content="https://d2j66m9udyg9yq.cloudfront.net/og-image.png" />

    <!-- 피드 자동발견. 브라우저·리더가 이 태그를 보고 구독 경로를 찾는다.
         내용은 scripts/gen-static.mjs가 content/devlog/에서 만들며, 서버(EC2)와
         무관하게 S3에서 서빙된다 — 서버가 꺼져 있어도 살아 있는 경로다. -->
    <link rel="alternate" type="application/rss+xml" title="DEV 블로그" href="/rss.xml" />

    <!-- PWA: 홈화면 설치용. iOS는 '홈화면에 추가'로 설치돼야 Web Push가 동작한다
         (사파리 탭에서는 알림 권한 자체를 안 준다) → 알림 기능의 전제 조건이다.
         apple-touch-icon은 SVG를 안 받으므로 PNG를 따로 둔다(scripts/gen_pwa_icons.py). -->
    <!-- 확장자가 .webmanifest가 아니라 .json인 이유: 프로덕션은 nginx가 아니라
         S3+CloudFront가 서빙하는데, `aws s3 sync`도 nginx 기본 mime.types도
         .webmanifest를 몰라 application/octet-stream으로 내보낸다. 양쪽에
         MIME 설정을 따로 넣느니 둘 다 아는 확장자를 쓰는 편이 덜 깨진다. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#863bff" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DEV 블로그" />

    <!-- 폰트: dynamic-subset(가변축). 2026-08-10 심층검사에서 잰 것 —
         옛 `static/pretendard.min.css`는 **비서브셋**이라 woff2 한 웨이트가 765,892 B다
         (curl 실측). 코드가 실제로 쓰는 웨이트는 400/500/600/700 넷이라 약 3 MB이고,
         이건 JS 번들(brotli 175 KB)의 열 배가 넘는다 — 번들을 깎는 논의가 무의미해지는 규모.
         dynamic-subset은 unicode-range로 92조각이라 **실제 렌더한 글자 조각만** 내려온다.
         static-subset이 아니라 variable을 고른 이유: static은 웨이트마다 따로 받지만
         variable은 가변축(45~920) 하나가 넷을 다 덮어 조각당 파일이 하나다
         (조각당 34.6 KB vs 52.6 KB, 요청 1/4).
         ⚠️ 이 CSS가 정의하는 family 이름은 **'Pretendard Variable'**이다. `Pretendard`라는
            이름은 한 번도 정의하지 않으므로 src/index.css의 폰트 스택도 같이 고쳐야 한다.
            안 고치면 매치 실패로 system-ui에 폴백해 **CSS만 받고 폰트는 안 쓰는 상태**가
            되는데, 화면은 그럭저럭 보여서 "고쳤다"고 기록된 채 넘어간다.
         `as="style"`은 뺐다 — rel="preload" 전용 속성이라 stylesheet에서는 무시되고,
         우선순위를 준 것 같은 착각만 만든다. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  </head>
  <body>
    <!-- JS가 못 뜨면 이 페이지는 완전한 백지다(root가 비어 있으므로).
         이 블로그는 '서버가 꺼져 있어도 읽힌다'를 설계 원칙으로 삼아 정적 아카이브를
         따로 만들어 두는데, 정작 **JS 실패 경로**에만 그 탈출구가 없었다.
         스크립트 차단·구형 브라우저·캐시에 남은 옛 해시 번들 404가 그 경우다. -->
    <noscript>
      <div style="max-width:44rem;margin:4rem auto;padding:0 1.25rem;font:16px/1.7 system-ui,sans-serif">
        <h1 style="font-size:1.5rem">자바스크립트가 꺼져 있어</h1>
        <p>이 화면은 자바스크립트로 그려져. 그래도 글은 읽을 수 있어 — 아래는 서버도 스크립트도 필요 없는 정적 페이지야.</p>
        <p>
          <a href="/devlog.html">개발일지 전체 보기</a> ·
          <a href="/rss.xml">RSS</a>
        </p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
