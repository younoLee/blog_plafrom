# 카오스 훈련용 격리 스택. `docker-compose.yml`에 겹쳐 쓴다.
#
# 격리가 규칙이다(07-28) — 훈련이 남의 작업 환경을 죽이면 안 된다.
# 프로젝트 이름을 `chaos`로 두고 포트를 전부 옮긴다: 18000·15432·11025·18025.
#
# extra_hosts가 이 파일의 핵심이다. 푸시·토스는 목적지가 코드 상수라 환경변수로
# 갈아끼울 수 없다 — DNS를 가로채는 것이 유일한 통로다. `blackhole`이 그 자리에 선다.
services:
  blackhole:
    image: python:3.12-slim
    # ⚠️ 상대경로는 **프로젝트 루트**(docker-compose.yml이 있는 곳) 기준으로 풀린다.
    # 이 파일이 있는 ops/chaos/ 기준이 아니다 — `./blackhole.py`로 적었다가
    # 저장소 루트를 가리켜 마운트가 빈 파일이 됐다(2026-08-26).
    volumes:
      - ./ops/chaos/blackhole.py:/app/blackhole.py:ro
      - ./ops/chaos/certs:/certs:ro
      - chaos_state:/state
    command: python /app/blackhole.py
    networks:
      default:
        # extra_hosts가 이 IP를 가리킨다. 고정하지 않으면 재기동마다 바뀌어
        # 주입이 조용히 안 닿는다 — 그걸 '앱이 견뎠다'로 읽으면 훈련이 거짓말을 한다.
        ipv4_address: 172.30.0.9
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('127.0.0.1',80),2)"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    ports: !override
      - "15432:5432"

  mailpit:
    ports: !override
      - "11025:1025"
      - "18025:8025"

  backend:
    ports: !override
      - "18000:8000"
    # 바깥 의존을 전부 blackhole로 돌린다. 컨테이너 안에서만 유효하므로
    # 호스트나 다른 스택에는 영향이 없다.
    extra_hosts:
      - "fcm.googleapis.com:${CHAOS_BH_IP:-172.30.0.9}"
      - "web.push.apple.com:${CHAOS_BH_IP:-172.30.0.9}"
      - "api.tosspayments.com:${CHAOS_BH_IP:-172.30.0.9}"
      - "api.anthropic.com:${CHAOS_BH_IP:-172.30.0.9}"
      - "api.openai.com:${CHAOS_BH_IP:-172.30.0.9}"
      - "generativelanguage.googleapis.com:${CHAOS_BH_IP:-172.30.0.9}"
      - "api.cohere.com:${CHAOS_BH_IP:-172.30.0.9}"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      # 사설 CA를 신뢰 저장소에 넣는다. 이게 없으면 세 모드가 전부 '연결 오류'로
      # 수렴해 refuse/hang/error를 구분할 수 없다(make_ca.sh 주석 참고).
      - ./ops/chaos/certs/ca.crt:/usr/local/share/ca-certificates/chaos-ca.crt:ro
    environment:
      # requests·httpx 계열이 보는 번들. update-ca-certificates를 못 돌리는(비-root)
      # 컨테이너에서도 통하게 환경변수로 직접 가리킨다.
      REQUESTS_CA_BUNDLE: /usr/local/share/ca-certificates/chaos-ca.crt
      SSL_CERT_FILE: /usr/local/share/ca-certificates/chaos-ca.crt
      # 푸시가 꺼져 있으면 주입해도 아무 일이 안 난다 — 훈련이 무의미해진다.
      # 훈련용 더미 키다(gen_vapid_keys.py로 만든 값을 넣어도 된다).
      VAPID_SUBJECT: mailto:chaos@example.com

  frontend:
    ports: !override
      - "15173:80"

volumes:
  chaos_state:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
