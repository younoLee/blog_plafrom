# PR·push마다 도는 검증 게이트. deploy.yml(배포)과 분리 — 이건 '망가졌나'를 본다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 저장소 기본값을 상속하지 않게 최소 권한을 명시한다. CI는 코드를 읽기만 하면 되고,
# 서드파티 액션이 침해됐을 때 토큰으로 할 수 있는 일을 좁힌다(2026-07-22 보안검사).
permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    # 테스트는 실제 Postgres 대상(앱이 ARRAY·pg_trgm에 의존 → SQLite 불가).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blog_test
      SECRET_KEY: ci-secret-key-0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: 의존성 설치
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: 린트(ruff)
        working-directory: backend
        run: ruff check .
      - name: pytest
        working-directory: backend
        run: pytest

      # 테스트는 conftest의 Base.metadata.create_all로 스키마를 만든다. 편하지만
      # **마이그레이션을 한 번도 안 돌린다** — 그래서 alembic이 깨져 있어도 CI는
      # 초록이고, 프로드 컨테이너가 뜨면서 `alembic upgrade head`를 할 때 처음
      # 드러난다(그때는 이미 배포 중이다). 빈 DB에 실제로 올려서 그 구멍을 막는다.
      - name: 마이그레이션이 빈 DB에서 실제로 올라가는가
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blog_migr
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c 'create database blog_migr;'
          alembic upgrade head
          alembic current

      # 모델에만 컬럼을 추가하고 마이그레이션을 안 만들면 create_all 덕에 테스트는
      # 통과한다. `alembic check`은 모델과 마이그레이션의 차이를 보고 실패한다.
      - name: 모델 ↔ 마이그레이션 드리프트
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blog_migr
        run: alembic check

  frontend:
    runs-on: ubuntu-latest
    # 유닛테스트(vitest) + tsc·빌드 통과를 게이트로.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 의존성 설치
        working-directory: frontend
        run: npm ci
      - name: 린트(eslint)
        working-directory: frontend
        run: npm run lint
      - name: 유닛테스트(vitest)
        working-directory: frontend
        run: npm test
      - name: 빌드(타입체크 포함)
        working-directory: frontend
        run: npm run build

  scripts:
    runs-on: ubuntu-latest
    # 이 저장소의 안전장치(백업·복원·정지·감시)는 전부 셸 스크립트인데 여태
    # 아무도 검사하지 않았다. 2026-07-22에 나온 버그 대부분이 여기 있었다 —
    # `head -1`의 EPIPE, `docker compose exec -T`의 stdin 삼킴, 미인용 변수.
    steps:
      - uses: actions/checkout@v7
      - name: 문법(bash -n)
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
      # 주석은 "glob으로 전부 잡는다"고 했는데 실제 args는 하드코딩된 6개 목록이었다
      # (`uses: docker://…`의 args는 glob을 확장해주지 않는다). 그래서 그 주석이 경고한
      # 바로 그 상태가 그대로 있었다 — 2026-07-28에 세어보니 스크립트 7개 중 6개만
      # 검사되고 ecs-oneshot.sh가 빠져 있었다. run 스텝으로 바꿔 러너 셸이 glob을
      # 확장하게 한다. 이제 새 스크립트는 추가되는 순간부터 검사된다.
      # (넓히자마자 실제로 걸렸다: 이 커밋에서 추가한 check_runbook_drift.sh의 SC1087)
      - name: shellcheck (scripts/*.sh 전부)
        run: docker run --rm -v "$PWD":/mnt -w /mnt koalaman/shellcheck:stable -S warning scripts/*.sh

  runbook:
    runs-on: ubuntu-latest
    # 복구 런북이 코드와 어긋났는지. 2026-07-27 DR 게임데이의 첫 블로커(F1)가
    # 이 부류였다 — 07-24에 추가된 '기본값 없는 변수'가 남아 재해 복구의 첫 명령이
    # 죽는 상태로 3일이 지났고, 아무도 DR 경로를 밟지 않아 몰랐다.
    #
    # `terraform plan`이면 확실히 잡지만 자격증명 + **상태 읽기**가 필요하다.
    # 이 저장소의 tfstate에는 시크릿이 들어 있어서(origin_secret 등), CI에 state
    # 읽기 권한을 주는 건 잡으려는 문제보다 비싼 거래다. 그래서 정적으로 잡는다.
    steps:
      - uses: actions/checkout@v7
      - name: 런북 드리프트
        run: scripts/check_runbook_drift.sh

  secrets-scan:
    runs-on: ubuntu-latest
    # 커밋에 시크릿이 섞여 들어가는 것. 2026-07-22에 `.env`가 이미지에 구워진 채로
    # 운영에 돌고 있었다 — 그때까지 이 검사는 '사람이 눈으로'였다.
    # **이미지보다 깃이 나쁘다: 푸시하면 되돌릴 수 없다.**
    steps:
      - uses: actions/checkout@v7
        with:
          # 히스토리 전체를 본다. 얕은 체크아웃이면 '커밋했다 지운' 시크릿을 놓친다 —
          # 지워도 히스토리에 남으니 그게 정확히 위험한 경우다. 199커밋에 0.8초라 싸다.
          fetch-depth: 0
      - name: gitleaks (히스토리 전체)
        # 다이제스트로 고정한다. :stable 류 태그는 언제 바뀌는지 알 수 없고,
        # 시크릿 스캐너가 조용히 바뀌는 건 검사 자체를 못 믿게 만든다.
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git . -c /repo/.gitleaks.toml --no-banner --redact

  deps-scan:
    runs-on: ubuntu-latest
    # 의존성 취약점. 지금까지 이 검사가 **아예 없었다**.
    # 게이트 방식은 scripts/check_vulns.py 참고 — 요지는 '판단한 것만 통과'다.
    # (`--audit-level=high`면 오늘 당장 빨간불, `critical`이면 진짜 high도 조용하다)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: pip-audit 설치
        run: pip install pip-audit
      # npm audit은 package-lock.json만으로 돈다(node_modules 불필요 — 실측 확인).
      - name: 취약점 검사
        run: python3 scripts/check_vulns.py

  terraform:
    runs-on: ubuntu-latest
    # 인프라도 코드다. fmt·validate가 없으면 문법 오류를 apply 할 때 처음 안다.
    # (plan은 AWS 자격증명이 필요하고 상태를 읽으므로 CI에서는 하지 않는다.
    #  변수 값 관련 드리프트는 위 runbook 잡이 정적으로 본다)
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
      - name: 포맷
        run: terraform -chdir=terraform fmt -check -recursive
      - name: 검증
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate
