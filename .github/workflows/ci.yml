# PR·push마다 도는 검증 게이트. deploy.yml(배포)과 분리 — 이건 '망가졌나'를 본다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 저장소 기본값을 상속하지 않게 최소 권한을 명시한다. CI는 코드를 읽기만 하면 되고,
# 서드파티 액션이 침해됐을 때 토큰으로 할 수 있는 일을 좁힌다(2026-07-22 보안검사).
permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    # 테스트는 실제 Postgres 대상(앱이 ARRAY·pg_trgm에 의존 → SQLite 불가).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blog_test
      SECRET_KEY: ci-secret-key-0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: 의존성 설치
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: 린트(ruff)
        working-directory: backend
        run: ruff check .

      # 타입 검사. 2026-08-11에 처음 돌려 **pytest 300개와 ruff가 못 잡은 결함 둘**을
      # 찾았다 — `db.get()`의 None을 안 보고 `.display_name`을 읽던 500 경로와,
      # 반환 타입이 `tuple[str, str]`인데 `str | None`을 담아 돌려주던 거짓 시그니처.
      # 타입은 **실행되지 않은 경로**를 보기 때문에 테스트와 겹치지 않는다.
      # 설정 근거와 per-module 예외는 backend/mypy.ini에 적었다(노이즈 0으로 만든 뒤 켰다).
      - name: 타입(mypy)
        working-directory: backend
        run: mypy -p app
      - name: pytest
        working-directory: backend
        run: pytest

      # 테스트는 conftest의 Base.metadata.create_all로 스키마를 만든다. 편하지만
      # **마이그레이션을 한 번도 안 돌린다** — 그래서 alembic이 깨져 있어도 CI는
      # 초록이고, 프로드 컨테이너가 뜨면서 `alembic upgrade head`를 할 때 처음
      # 드러난다(그때는 이미 배포 중이다). 빈 DB에 실제로 올려서 그 구멍을 막는다.
      - name: 마이그레이션이 빈 DB에서 실제로 올라가는가
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blog_migr
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c 'create database blog_migr;'
          alembic upgrade head
          alembic current

      # 모델에만 컬럼을 추가하고 마이그레이션을 안 만들면 create_all 덕에 테스트는
      # 통과한다. `alembic check`은 모델과 마이그레이션의 차이를 보고 실패한다.
      - name: 모델 ↔ 마이그레이션 드리프트
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blog_migr
        run: alembic check

  frontend:
    runs-on: ubuntu-latest
    # 유닛테스트(vitest) + tsc·빌드 통과를 게이트로.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 의존성 설치
        working-directory: frontend
        run: npm ci
      - name: 린트(eslint)
        working-directory: frontend
        run: npm run lint
      - name: 유닛테스트(vitest)
        working-directory: frontend
        run: npm test
      - name: 빌드(타입체크 포함)
        working-directory: frontend
        run: npm run build

  scripts:
    runs-on: ubuntu-latest
    # 이 저장소의 안전장치(백업·복원·정지·감시)는 전부 셸 스크립트인데 여태
    # 아무도 검사하지 않았다. 2026-07-22에 나온 버그 대부분이 여기 있었다 —
    # `head -1`의 EPIPE, `docker compose exec -T`의 stdin 삼킴, 미인용 변수.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 문법(bash -n)
        # `scripts/*.sh` glob은 하위 디렉터리를 안 본다 — 아래 shellcheck는 2026-08-10에
        # find로 바꿨는데 **이 스텝만 안 쓸려 있었다.** 그래서 5개 스크립트의 공통 입구인
        # scripts/lib/ec2.sh에 문법 오류가 들어가도 CI가 초록이었다. 바로 아래 주석이
        # "구멍을 닫았다"고 적어둔 그 구멍이 윗줄에 열려 있던 셈이다(2026-08-11 공백검사).
        #
        # 2026-08-27: `ops/`를 더한다. 카오스 훈련 하네스(ops/chaos/*.sh)가 08-26에
        # 생겼는데 **검사 대상에 한 번도 안 들어와 있었다.** 이 잡의 주석 셋이 전부
        # "검사 대상이 새로 생겼는데 조용히 빠진다"를 경고하고 있었는데, 경고한 그
        # 모양이 새 디렉터리로 또 일어났다. 대상을 디렉터리 목록으로 두는 한 반복된다.
        run: |
          find scripts ops -name '*.sh' -print0 | xargs -0 -n1 bash -n
      # 주석은 "glob으로 전부 잡는다"고 했는데 실제 args는 하드코딩된 6개 목록이었다
      # (`uses: docker://…`의 args는 glob을 확장해주지 않는다). 그래서 그 주석이 경고한
      # 바로 그 상태가 그대로 있었다 — 2026-07-28에 세어보니 스크립트 7개 중 6개만
      # 검사되고 ecs-oneshot.sh가 빠져 있었다. run 스텝으로 바꿔 러너 셸이 glob을
      # 확장하게 한다. 이제 새 스크립트는 추가되는 순간부터 검사된다.
      # 2026-08-10: `scripts/*.sh`는 **하위 디렉터리를 안 본다**. scripts/lib/ec2.sh를
      # 만들면서 같은 구멍이 다시 열렸다 — 검사 대상이 새로 생겼는데 조용히 빠지는,
      # 위 문단이 고쳤다고 적은 바로 그 모양이다. glob 대신 find로 바꿔 깊이를 없앤다.
      # (넓히자마자 실제로 걸렸다: 이 커밋에서 추가한 check_runbook_drift.sh의 SC1087)
      # 이미지도 다이제스트로 고정한다. `:stable`은 언제 무엇으로 바뀌는지 알 수 없고,
      # 린터가 조용히 바뀌면 어제 초록이던 코드가 오늘 빨간불이 되거나 그 반대가 된다.
      # 어느 쪽이든 검사를 못 믿게 된다. 갱신은 사람이 판단해서. (현재 v0.11.0)
      - name: shellcheck (scripts·ops의 *.sh 전부)
        run: |
          docker run --rm -v "$PWD":/mnt -w /mnt \
            koalaman/shellcheck@sha256:bb596a0d169b85ddd81d8b6d3a2ff6d5baf5fca10b97f575ebc647c3dff62b3d \
            -S warning $(find scripts ops -name '*.sh' | sort)

      # CloudFront Function은 이 사이트의 모든 정적 요청이 지나가는 자리인데
      # 여태 아무도 검사하지 않았다 — terraform validate는 이 .js를 문자열로만 보고
      # (file()로 읽는다), 배포되면 그때부터 라이브다. 틀리면 증상이 '사이트 전체가
      # 404'라 조용하지도 않지만, 조용하지 않은 게 배포 뒤라는 게 문제다.
      #
      # ⚠️ **경로는 디렉터리가 아니라 파일이어야 한다.** 처음엔 `node --test terraform/`로
      # 썼고 로컬(Node 20)에서는 7/7 초록이었는데 러너(Node 24)에서 빨간불이었다.
      # Node 22부터 `--test`에 준 경로를 **테스트 파일 하나로 취급**해서, 디렉터리를 주면
      # 파일 목록을 훑지 않고 그 디렉터리를 실행하려다 실패한다
      # (증상: "test at terraform:1:1 ✖ terraform" — 내 단언은 하나도 안 돌았다).
      # 세 버전(20·22·24)에서 파일 경로로 재확인했다: 전부 7/7.
      - name: CloudFront Function 동작(node --test)
        run: node --test terraform/cf-functions.test.mjs

      # tags.json은 **생성물인데 커밋한다**(CI·배포는 파이썬을 돌리지 않으므로 다리가 필요하다).
      # 생성물을 커밋하면 원본과 어긋날 수 있다 — POSTS를 고치고 내보내기를 잊는 경로다.
      # 그러면 제목·태그가 DB(발행 스크립트)와 정적 아카이브에서 달라지는데, 두 화면을
      # 나란히 놓기 전엔 아무도 모른다. 여기서 다시 만들어 diff로 잡는다.
      # (빌드 쪽 짝은 gen-static.mjs의 제목 대조 가드다 — 그쪽은 tags.json ↔ 마크다운 H1을 본다.)
      - name: tags.json이 POSTS와 동기인가
        run: |
          python3 scripts/devlog_posts.py > /dev/null
          if ! git diff --quiet content/devlog/tags.json; then
            echo "::error::content/devlog/tags.json이 scripts/devlog_posts.py의 POSTS와 다릅니다."
            echo "→ 로컬에서 \`python scripts/devlog_posts.py\`를 돌리고 그 결과를 커밋하세요."
            git diff --stat content/devlog/tags.json
            exit 1
          fi
          echo "tags.json 동기 OK"

      # 발행되는 글에 운영 실제 값이 실렸는지. 2026-08-19 보안검사가 실제로 잡았다 —
      # 발행된 34편 중 5편에 실계정 이메일 3개(역할까지)·집 공인 IP 2개·오리진 EC2
      # 호스트명이 라이브로 나가 있었고, RSS와 검색 인덱스에도 들어가 있었다.
      # 개발일지가 터미널 출력을 그대로 싣는 형식이라 사람 눈으로는 계속 샌다.
      - name: 발행물에 실제 값이 없는가
        run: python3 scripts/check_publish_secrets.py

      # 글투 지침(docs/voice/style-guide.md)이 실제로 지켜지는가.
      #
      # 2026-08-27까지 이 측정기는 **CI 어디에도 없었다.** 지침은 08-18에 생겼는데
      # 재는 것은 사람이 기억할 때만 돌았다. 붙이지 못한 이유가 있었다 — 인자 없이
      # 돌리면 36편 전부를 재서 고칠 자리 107곳으로 영원히 빨간불이고, 영원히
      # 빨간불인 검사는 잡으로 만들 수 없다.
      #
      # `--since-guide`가 그 매듭을 푼다. 지침의 "이미 발행된 33편은 소급하지 않는다"를
      # **코드로 표현**해서(GUIDE_EFFECTIVE), 발효일 이후 글만 본다. 지금은 3편이고
      # 새 글을 쓸 때마다 늘어난다.
      #
      # `--selftest`를 먼저 돌리는 이유: 삼항 반복 탐지기가 08-27까지 역참조 정규식이라
      # **아무것도 못 잡고 있었는데**, 잡히는 건수가 0이 아니어서(오탐 3건) 죽은 줄
      # 몰랐다. 규칙이 있는데 한 번도 측정된 적이 없는 게 규칙이 없는 것보다 나쁘다.
      # 탐지기가 다시 죽으면 여기서 걸린다.
      - name: 글투 (자가검증 → 발효일 이후 글)
        run: |
          python3 scripts/writing_style_check.py --selftest
          python3 scripts/writing_style_check.py --since-guide

  runbook:
    runs-on: ubuntu-latest
    # 복구 런북이 코드와 어긋났는지. 2026-07-27 DR 게임데이의 첫 블로커(F1)가
    # 이 부류였다 — 07-24에 추가된 '기본값 없는 변수'가 남아 재해 복구의 첫 명령이
    # 죽는 상태로 3일이 지났고, 아무도 DR 경로를 밟지 않아 몰랐다.
    #
    # `terraform plan`이면 확실히 잡지만 자격증명 + **상태 읽기**가 필요하다.
    # 이 저장소의 tfstate에는 시크릿이 들어 있어서(origin_secret 등), CI에 state
    # 읽기 권한을 주는 건 잡으려는 문제보다 비싼 거래다. 그래서 정적으로 잡는다.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 런북 드리프트
        run: scripts/check_runbook_drift.sh

  secrets-scan:
    runs-on: ubuntu-latest
    # 커밋에 시크릿이 섞여 들어가는 것. 2026-07-22에 `.env`가 이미지에 구워진 채로
    # 운영에 돌고 있었다 — 그때까지 이 검사는 '사람이 눈으로'였다.
    # **이미지보다 깃이 나쁘다: 푸시하면 되돌릴 수 없다.**
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 히스토리 전체를 본다. 얕은 체크아웃이면 '커밋했다 지운' 시크릿을 놓친다 —
          # 지워도 히스토리에 남으니 그게 정확히 위험한 경우다. 199커밋에 0.8초라 싸다.
          fetch-depth: 0
      - name: gitleaks (히스토리 전체)
        # 다이제스트로 고정한다. :stable 류 태그는 언제 바뀌는지 알 수 없고,
        # 시크릿 스캐너가 조용히 바뀌는 건 검사 자체를 못 믿게 만든다.
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git . -c /repo/.gitleaks.toml --no-banner --redact

  deps-scan:
    runs-on: ubuntu-latest
    # 의존성 취약점. 지금까지 이 검사가 **아예 없었다**.
    # 게이트 방식은 scripts/check_vulns.py 참고 — 요지는 '판단한 것만 통과'다.
    # (`--audit-level=high`면 오늘 당장 빨간불, `critical`이면 진짜 high도 조용하다)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      # 버전을 고정한다. 이 도구의 JSON 스키마에 scripts/check_vulns.py가 의존하는데,
      # 스키마가 바뀌면 파서가 빈 결과를 받고 '취약점 없음'으로 읽힐 수 있다.
      # (그 부류의 조용한 통과가 2026-07-28 심층검사에서 실제로 나왔다)
      - name: pip-audit 설치
        run: pip install "pip-audit==2.10.1"
      # npm audit은 package-lock.json만으로 돈다(node_modules 불필요 — 실측 확인).
      - name: 취약점 검사
        run: python3 scripts/check_vulns.py

  terraform:
    runs-on: ubuntu-latest
    # 인프라도 코드다. fmt·validate가 없으면 문법 오류를 apply 할 때 처음 안다.
    # (plan은 AWS 자격증명이 필요하고 상태를 읽으므로 CI에서는 하지 않는다.
    #  변수 값 관련 드리프트는 위 runbook 잡이 정적으로 본다)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: 포맷
        run: terraform -chdir=terraform fmt -check -recursive
      - name: 검증
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate
