# 감시 — 예약 자동 점검. 실패하면 GitHub이 메일로 알려준다.
# (**"매시"라고 적지 않는다. 실제로 매시가 아니다** — 실측은 아래 schedule 주석에)
#
# 왜 이게 필요한가: 이 계정에는 CloudWatch 알람·SNS·CloudTrail이 전부 0개였고,
# 살아 있는 감시는 월 예산 알림 하나뿐이었다. 그래서 백업이 4개월간 0건인 것도,
# 이미지 업로드가 AccessDenied인 것도, SES 프로덕션 액세스가 거부된 것도
# 전부 사람이 우연히 발견할 때까지 몇 주씩 방치됐다.
#
# 왜 AWS가 아니라 GitHub Actions인가:
#   · 이 저장소는 공개라 Actions 분 제한이 없다(무료).
#   · 실패 알림 경로가 이미 있다(Actions 실패 → 계정 메일). SNS 토픽을 새로 만들 필요가 없다.
#   · **AWS 바깥에서** 찔러야 의미가 있다. 서버 안 자가점검은 CloudFront도 오리진도 못 본다.
#   · 상시 리소스가 안 늘어난다(Lambda·EventBridge 불필요).
#
# ⚠️ GitHub은 60일간 커밋이 없는 저장소의 스케줄 워크플로를 자동으로 멈춘다.
#    오래 손을 놓을 거면 Actions 탭에서 다시 켜야 한다.
name: 감시

on:
  schedule:
    # 매시 17분을 **요청한다**. 정각은 GitHub 스케줄러가 붐벼 지연이 더 크다.
    #
    # ⚠️ **요청이지 보장이 아니다. 이 감시는 매시 돌지 않는다.**
    # 2026-09-04 실측(GitHub API, 예약 실행 100회):
    #
    #                     실행/기대      간격 중앙   평균    최대   3h 초과
    #   08-23~09-04   100회 / 268회(37%)   1.4h    2.7h   13.3h   34/99
    #   08-31~09-04    23회 /  94회(24%)   4.4h    4.3h    8.3h   19/22
    #
    # 즉 최근으로 올수록 더 벌어지고 있다. 실행 시각의 '분'도 17분이 아니라
    # 0~59분에 고루 흩어져 있어서, cron 에 적은 값은 시간도 분도 지켜지지 않는다.
    # GitHub 이 부하 때 예약 워크플로를 **지연시키거나 통째로 거르기** 때문이고
    # (건너뛴 실행은 나중에 몰아서 돌지 않는다), 이쪽에서 고칠 수 있는 값이 아니다.
    #
    # 그래서 이 감시의 실제 보장은 "매시"가 아니라 **"보통 1~5시간, 나쁘면 반나절"**이다.
    # 그 공백 동안 조용한 고장은 조용한 채로 남는다 — 시간에 민감한 것(예: 켜둔 채
    # 과금 중, 인스턴스 정지)을 이 스크립트에만 맡기면 안 되는 이유이고, 그 부류는
    # CloudWatch 알람이 따로 본다(terraform/alerts.tf).
    #
    # 하트비트 알람(blog-watch-heartbeat-missing)의 창이 3시간이 아니라 12시간인 것도
    # 같은 실측 위에 서 있다(alerts.tf:200-212, 2026-08-31에 넓혔다). 08-27~08-30에
    # 오탐으로 여덟 번 왕복하던 것이 그 뒤로는 한 번도 안 울었다 — 08-31 이후 최대
    # 간격이 8.3시간이라 12시간 창 안에 들어온다. 이 값을 3시간으로 되돌리면
    # 22개 간격 중 19개가 알람이 된다.
    #
    # 재발 방지: 이 파일이나 watch.sh 의 주기를 설명할 때는 cron 값이 아니라
    # 위 실측을 인용할 것. cron 값을 그대로 옮겨 적는 순간 다시 틀린 문장이 된다.
    - cron: '17 * * * *'
  workflow_dispatch: {}

# OIDC로 역할을 맡는다(장기 키 없음). 신뢰 조건이 main 브랜치라
# 스케줄 실행(기본 브랜치에서 돎)도 그대로 통과한다.
permissions:
  id-token: write
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 히스토리 전체를 받는다. watch.sh의 7절이 '배포 스탬프의 커밋 ↔ HEAD' 사이에
          # 프론트 변경이 있는지 세는데, 기본 얕은 체크아웃(depth 1)이면 그 커밋이
          # 아예 없어서 **비교가 항상 통과한다** — 조용히 초록인 검사가 하나 느는 셈이다.
          # (ci.yml의 gitleaks 잡에서 실측: 199커밋에 0.8초)
          fetch-depth: 0

      - name: AWS 자격증명 (OIDC)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::181568979775:role/github-actions-blog-watch
          aws-region: ap-northeast-2

      - name: 점검
        run: bash scripts/watch.sh
