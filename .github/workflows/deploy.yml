name: Deploy Frontend

# **푸시 자동 배포를 폐지했다(2026-08-11).** 수동 실행만 남긴다.
#
# 왜 — 아래 게이트가 fail-open이었다. 게이트는 `github.event.before → github.sha`,
# 즉 **그 push의 diff만** 본다. 그래서 백엔드가 섞인 push는 막지만, **그 다음 push는
# 백엔드가 여전히 미배포인데도 통과한다.** 2026-08-10에 막힌 프론트가 다음 날 문서·의존성
# push에 얹혀 그대로 나갔다(run #60 실패 → #61 성공). 한 번 막고 나면 그 뒤로는 안 지킨다.
#
# 제대로 고치려면 "지금 서버에 떠 있는 백엔드가 어느 커밋인가"를 알아야 하는데,
# 그 기록이 저장소·서버·AWS 어디에도 없다. 기준이 없으니 게이트가 비교할 대상이 없다.
# 마커 파일을 만드는 길도 있었지만(배포 후 커밋을 사람이 잊으면 또 샌다),
# **백엔드 배포가 이미 100% 수동**이라 프론트만 자동일 이유가 애초에 없었다.
# 순서를 지키는 주체를 사람 하나로 모은다 — 장치가 늘지 않고 상태 불일치가 불가능해진다.
#
# 대가: 프론트를 바꾸면 Actions 탭에서 'Run workflow'를 눌러야 한다. 개발일지를 올릴
# 때도 마찬가지다(정적 아카이브·RSS·sitemap이 그때 갱신된다 — 안 누르면 피드가 옛 상태).
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC 토큰 발급(AWS 역할 assume)에 필수
      contents: read  # checkout용 최소 권한
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # 전체 이력은 없앤 게이트가 push 범위를 diff 하려고 요구하던 것이다.
        # 빌드(gen-static.mjs 포함)는 git을 전혀 쓰지 않으므로 얕은 체크아웃으로 충분하다.

      # 여기 있던 '백엔드 동시 변경 게이트'는 2026-08-11에 **지웠다**(위 on: 주석 참고).
      # 남겨두면 `if: github.event_name == 'push'`라 수동 실행에서는 한 번도 안 도는,
      # 초록불만 하나 더 그리는 죽은 검사가 된다. 이 저장소가 07-28·08-10에 두 번
      # 잡아낸 '검사인 척하던 검사'와 같은 모양이라 흔적을 남기지 않는다.
      #
      # 순서 규칙 자체는 그대로다: **scripts/deploy_backend.sh 로 백엔드를 먼저 올리고,
      # 그다음 이 워크플로를 Run workflow로 돌린다.** 2026-07-11에 이 순서를 어겨
      # 아직 없는 API를 프론트가 호출했다(PROGRESS.md:1147).

      - name: Node 설치
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      - name: 빌드
        working-directory: frontend
        env:
          VITE_API_BASE: https://d2j66m9udyg9yq.cloudfront.net/api
          # 라이브 결제 전환: 리포지토리 Variables에 TOSS_CLIENT_KEY(live_ck_...)를 설정하면 주입됨.
          # 미설정이면 빈 값 → 프론트가 토스 테스트 키로 폴백(실제 청구 없음).
          # 클라이언트키는 비밀이 아니라 Secrets가 아닌 Variables로 관리. 시크릿키는 EC2 .env에만.
          VITE_TOSS_CLIENT_KEY: ${{ vars.TOSS_CLIENT_KEY }}
        run: npm run build

      # 빌드 스크립트(scripts/gen-static.mjs)는 content/devlog가 없으면 **조용히
      # 건너뛴다** — 프론트 Docker 이미지는 빌드 컨텍스트가 frontend/뿐이라 거기선
      # 정상적인 상황이라서다. 그런데 배포에서 같은 일이 벌어지면 RSS·sitemap 없이
      # 나가고도 초록불이 뜬다. 그 조용한 실패를 여기서 막는다.
      - name: 정적 산출물 확인 (조용한 누락 차단)
        working-directory: frontend
        run: |
          missing=""
          for f in rss.xml sitemap.xml robots.txt devlog.html; do
            [ -s "dist/$f" ] || missing="$missing $f"
          done
          count=$(ls dist/devlog/*.html 2>/dev/null | wc -l)
          if [ -n "$missing" ] || [ "$count" -eq 0 ]; then
            echo "::error::정적 산출물이 없습니다 —$missing (개발일지 페이지 $count개)"
            echo "content/devlog가 체크아웃됐는지, gen-static.mjs가 돌았는지 확인하세요."
            exit 1
          fi
          echo "정적 산출물 OK — 개발일지 $count편 + rss/sitemap/robots"

      - name: AWS 자격증명 (OIDC 역할 assume — 장기 키 없음)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::181568979775:role/github-actions-blog-deploy
          aws-region: ap-northeast-2

      - name: S3 업로드
        working-directory: frontend
        # uploads/* 는 사용자가 올린 이미지 → --delete가 지우지 않게 제외 (같은 버킷 공유)
        #
        # 2026-08-10: `--cache-control`이 없어서 **라이브 응답에 Cache-Control 헤더가 아예
        # 없었다**(curl 실측). CloudFront 엣지는 잘 캐시하지만(x-cache: Hit) 브라우저는 아무
        # 지시도 못 받아 휴리스틱 캐싱에 맡겨진다. 지시를 준다.
        #
        # **일부러 전부 must-revalidate 하나로 간다.** 해시 파일명 자산만 1년 immutable로
        # 빼는 2-pass가 이론상 낫지만, 이 dist에는 이름이 안 바뀌는 파일이 많다 —
        # devlog.html + devlog/*.html(편수는 content/devlog/의 파일 수를 따른다 —
        #  숫자를 박아두면 낡는다. 2026-08-11 기준 28편) · sw.js ·
        # manifest.json · favicon.svg · icons.svg · og-image.png · rss.xml · sitemap.xml.
        # 이걸 immutable 쪽에 잘못 넣으면 **배포해도 1년간 옛것이 뜬다.** 특히 sw.js는
        # 브라우저가 캐시하면 알림 로직이 영영 안 갱신된다(public/sw.js가 스스로 걱정하는 문제).
        # 게다가 2-pass는 `--delete`의 대상 범위가 --include/--exclude에 따라 갈려서,
        # 옛 해시 번들이 안 지워지거나 반대로 지우면 안 될 것이 지워지는 실수가 쉽다
        # (이 저장소는 `--delete`가 업로드 이미지를 지운 적이 이미 있다 —
        #  2026-07-30 05:03 UTC에 실제로 2개가 지워졌고, watch.sh가 '원본 0개'를
        #  '확인할 것 없음'으로 찍어 12일간 아무도 몰랐다. 08-11에 버저닝으로 복구).
        # must-revalidate여도 엣지 캐시는 그대로 돌고 브라우저는 304 한 번이면 끝난다.
        # 방문자가 사실상 없는 블로그에서 그 차이보다 '배포가 반영되지 않는 위험'이 크다.
        run: |
          aws s3 sync dist/ s3://blogplafromops --delete --exclude "uploads/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: CloudFront 캐시 무효화
        run: aws cloudfront create-invalidation --distribution-id E1438IL9CSVBS4 --paths "/*"
