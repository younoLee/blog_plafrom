name: Deploy Frontend

# **푸시 자동 배포를 폐지했다(2026-08-11).** 수동 실행만 남긴다.
#
# 왜 — 아래 게이트가 fail-open이었다. 게이트는 `github.event.before → github.sha`,
# 즉 **그 push의 diff만** 본다. 그래서 백엔드가 섞인 push는 막지만, **그 다음 push는
# 백엔드가 여전히 미배포인데도 통과한다.** 2026-08-10에 막힌 프론트가 다음 날 문서·의존성
# push에 얹혀 그대로 나갔다(run #60 실패 → #61 성공). 한 번 막고 나면 그 뒤로는 안 지킨다.
#
# 제대로 고치려면 "지금 서버에 떠 있는 백엔드가 어느 커밋인가"를 알아야 하는데,
# 그 기록이 저장소·서버·AWS 어디에도 없다. 기준이 없으니 게이트가 비교할 대상이 없다.
# 마커 파일을 만드는 길도 있었지만(배포 후 커밋을 사람이 잊으면 또 샌다),
# **백엔드 배포가 이미 100% 수동**이라 프론트만 자동일 이유가 애초에 없었다.
# 순서를 지키는 주체를 사람 하나로 모은다 — 장치가 늘지 않고 상태 불일치가 불가능해진다.
#
# 대가: 프론트를 바꾸면 Actions 탭에서 'Run workflow'를 눌러야 한다. 개발일지를 올릴
# 때도 마찬가지다(정적 아카이브·RSS·sitemap이 그때 갱신된다 — 안 누르면 피드가 옛 상태).
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC 토큰 발급(AWS 역할 assume)에 필수
      contents: read  # checkout용 최소 권한
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 2026-08-17부터 gen-static.mjs가 **git log를 읽는다**(/log.html과 편별 '그날의 커밋').
          # 얕은 체크아웃이면 이력이 1커밋뿐이라 그 페이지가 **조용히 거의 빈 채로** 나간다.
          # 예전 주석이 "빌드는 git을 전혀 쓰지 않는다"고 못박아뒀던 자리라, 그 전제가
          # 바뀐 것을 여기에 적어둔다. 315커밋짜리 저장소라 비용은 무시할 만하다.
          fetch-depth: 0

      # 여기 있던 '백엔드 동시 변경 게이트'는 2026-08-11에 **지웠다**(위 on: 주석 참고).
      # 남겨두면 `if: github.event_name == 'push'`라 수동 실행에서는 한 번도 안 도는,
      # 초록불만 하나 더 그리는 죽은 검사가 된다. 이 저장소가 07-28·08-10에 두 번
      # 잡아낸 '검사인 척하던 검사'와 같은 모양이라 흔적을 남기지 않는다.
      #
      # 순서 규칙 자체는 그대로다: **scripts/deploy_backend.sh 로 백엔드를 먼저 올리고,
      # 그다음 이 워크플로를 Run workflow로 돌린다.** 2026-07-11에 이 순서를 어겨
      # 아직 없는 API를 프론트가 호출했다(PROGRESS.md:1147).

      - name: Node 설치
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      - name: 빌드
        working-directory: frontend
        env:
          VITE_API_BASE: https://d2j66m9udyg9yq.cloudfront.net/api
          # 라이브 결제 전환: 리포지토리 Variables에 TOSS_CLIENT_KEY(live_ck_...)를 설정하면 주입됨.
          # 미설정이면 빈 값 → 프론트가 토스 테스트 키로 폴백(실제 청구 없음).
          # 클라이언트키는 비밀이 아니라 Secrets가 아닌 Variables로 관리. 시크릿키는 EC2 .env에만.
          VITE_TOSS_CLIENT_KEY: ${{ vars.TOSS_CLIENT_KEY }}
        run: npm run build

      # 빌드 스크립트(scripts/gen-static.mjs)는 content/devlog가 없으면 **조용히
      # 건너뛴다** — 프론트 Docker 이미지는 빌드 컨텍스트가 frontend/뿐이라 거기선
      # 정상적인 상황이라서다. 그런데 배포에서 같은 일이 벌어지면 RSS·sitemap 없이
      # 나가고도 초록불이 뜬다. 그 조용한 실패를 여기서 막는다.
      - name: 정적 산출물 확인 (조용한 누락 차단)
        working-directory: frontend
        run: |
          missing=""
          # og-image.png가 여기 없으면: 파일이 사라져도 초록불이 뜨고, `s3 sync --delete`가
          # S3에서 지운다. 그런데 index.html과 gen-static.mjs의 og:image는 계속 그 URL을
          # 가리키므로 **모든 공유 카드가 조용히 깨진다**(2026-08-12 검사).
          for f in rss.xml sitemap.xml robots.txt devlog.html devlog-index.json og-image.png lessons.html lessons-filter.js devlog-search.json favicon.ico log.html keywords.html map.html; do
            [ -s "dist/$f" ] || missing="$missing $f"
          done
          count=$(ls dist/devlog/*.html 2>/dev/null | wc -l)
          # 태그 허브(dist/tag/*.html)도 같은 이유로 센다 — 생성이 조용히 멈추면
          # 태그 칩이 전부 404가 되는데, 페이지 자체는 멀쩡히 만들어져 초록불이 뜬다.
          hubs=$(ls dist/tag/*.html 2>/dev/null | wc -l)
          if [ "$hubs" -eq 0 ]; then missing="$missing tag/*.html"; fi
          # 용어 색인(k/*.html)도 같은 이유로. log.html은 **얕은 체크아웃이면 안 만들어진다** —
          # fetch-depth: 0을 지운 순간 조용히 사라지는 자리라 여기서 센다.
          kws=$(ls dist/k/*.html 2>/dev/null | wc -l)
          if [ "$kws" -eq 0 ]; then missing="$missing k/*.html"; fi
          if [ -n "$missing" ] || [ "$count" -eq 0 ]; then
            echo "::error::정적 산출물이 없습니다 —$missing (개발일지 페이지 $count개)"
            echo "content/devlog가 체크아웃됐는지, gen-static.mjs가 돌았는지 확인하세요."
            exit 1
          fi
          echo "정적 산출물 OK — 개발일지 $count편 + 태그 허브 $hubs장 + 용어 $kws종 + rss/sitemap/robots"

      # devlog-index.json은 **랜딩(/)이 첫 화면에 그리는 목록**이다(2026-08-12 신설).
      # 존재 확인만으로는 부족하다 — 이 파일이 가리키는 slug가 실제 파일과 어긋나면
      # 방문자가 보는 첫 화면의 링크가 전부 404가 되는데, 그건 아무 데도 안 뜬다.
      # 이 사이트는 서버가 평소 꺼져 있어서 그 링크가 **글로 가는 유일한 경로**다.
      # 편수 일치 + 전 slug 실재를 여기서 fail-closed로 잠근다.
      - name: 랜딩 목록 무결성 (devlog-index.json ↔ 실제 페이지)
        working-directory: frontend
        run: |
          node -e '
            const fs = require("fs")
            const d = JSON.parse(fs.readFileSync("dist/devlog-index.json", "utf8"))
            const files = fs.readdirSync("dist/devlog").filter((f) => f.endsWith(".html"))
            const problems = []
            if (d.posts.length !== files.length)
              problems.push(`편수 불일치: json ${d.posts.length} vs 파일 ${files.length}`)
            if (d.total !== d.posts.length) problems.push(`total(${d.total})이 목록 길이와 다름`)
            if (!(d.chars > 0)) problems.push("chars가 0 이하")
            for (const p of d.posts) {
              if (!fs.existsSync(`dist/${p.slug}`)) problems.push(`없는 링크: ${p.slug}`)
              if (!p.title) problems.push(`제목 없음: ${p.date}`)
            }
            // og:image의 선언 치수와 **실제 PNG**를 대조한다. 이 검사가 없으면
            // 2026-08-12에 고친 사고(라이브가 343x361인데 summary_large_image라고 선언)가
            // 그대로 재발한다 — gen_og_image.py의 W,H를 바꾸고 재생성만 하면 메타가 거짓이 된다.
            // IHDR는 PNG 선두 고정 위치라 라이브러리 없이 읽는다.
            const png = fs.readFileSync("dist/og-image.png")
            const [pw, ph] = [png.readUInt32BE(16), png.readUInt32BE(20)]
            const html = fs.readFileSync("dist/index.html", "utf8")
            const declared = (p) => {
              const m = html.match(new RegExp(`og:image:${p}"\\s+content="(\\d+)"`))
              return m ? Number(m[1]) : null
            }
            if (declared("width") !== pw || declared("height") !== ph)
              problems.push(
                `og:image 치수 불일치: 선언 ${declared("width")}x${declared("height")} vs 실제 ${pw}x${ph}`,
              )

            if (problems.length) {
              for (const m of problems) console.error(`::error::랜딩 목록 ${m}`)
              process.exit(1)
            }
            console.log(
              `랜딩 목록 OK — ${d.total}편 · ${d.chars.toLocaleString()}자 · 링크 전부 실재 · og-image ${pw}x${ph}`,
            )
          '

      # 배포 스탬프 — "프론트가 어느 커밋으로 나가 있는가"를 산출물 안에 남긴다.
      #
      # 왜 필요한가: 2026-08-11에 푸시 자동배포를 폐지했다(게이트가 fail-open이라).
      # 이제 프론트는 **사람이 Run workflow를 눌러야** 나가는데, 안 눌렀다는 걸
      # 알려줄 장치가 저장소에 **하나도 없었다.** 백엔드·백업·이미지·메일·비용은
      # 전부 watch.sh가 보는데 프론트만 사각이었다 — 그리고 개발일지 정적 아카이브가
      # 바로 이 경로로 나간다(2026-08-11에 '아직 28편이 아니다'를 사람이 눈으로 발견).
      #
      # **dist/ 안에 쓴다.** 싱크 뒤에 따로 올리면 다음 배포의 `--delete`가 지웠다가
      # 다시 만드는 창이 생기고, 그 창에 감시가 돌면 "배포된 적 없음"으로 읽힌다.
      # 산출물의 일부로 두면 그 창 자체가 없다.
      #
      # 공개되는 값이다(CloudFront가 그대로 서빙). 공개 저장소의 커밋 SHA라 비밀이 아니다.
      - name: 배포 스탬프 기록
        working-directory: frontend
        run: |
          printf 'sha=%s\nref=%s\nrun=%s\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" > dist/deploy-stamp.txt
          cat dist/deploy-stamp.txt

      - name: AWS 자격증명 (OIDC 역할 assume — 장기 키 없음)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::181568979775:role/github-actions-blog-deploy
          aws-region: ap-northeast-2

      - name: S3 업로드
        working-directory: frontend
        # uploads/* 는 사용자가 올린 이미지 → --delete가 지우지 않게 제외 (같은 버킷 공유)
        #
        # 2026-08-10: `--cache-control`이 없어서 **라이브 응답에 Cache-Control 헤더가 아예
        # 없었다**(curl 실측). CloudFront 엣지는 잘 캐시하지만(x-cache: Hit) 브라우저는 아무
        # 지시도 못 받아 휴리스틱 캐싱에 맡겨진다. 지시를 준다.
        #
        # **일부러 전부 must-revalidate 하나로 간다.** 해시 파일명 자산만 1년 immutable로
        # 빼는 2-pass가 이론상 낫지만, 이 dist에는 이름이 안 바뀌는 파일이 많다 —
        # devlog.html + devlog/*.html(편수는 content/devlog/의 파일 수를 따른다 —
        #  숫자를 박아두면 낡는다. 2026-08-11 기준 28편) · sw.js ·
        # manifest.json · favicon.svg · icons.svg · og-image.png · rss.xml · sitemap.xml.
        # 이걸 immutable 쪽에 잘못 넣으면 **배포해도 1년간 옛것이 뜬다.** 특히 sw.js는
        # 브라우저가 캐시하면 알림 로직이 영영 안 갱신된다(public/sw.js가 스스로 걱정하는 문제).
        # 게다가 2-pass는 `--delete`의 대상 범위가 --include/--exclude에 따라 갈려서,
        # 옛 해시 번들이 안 지워지거나 반대로 지우면 안 될 것이 지워지는 실수가 쉽다
        # (이 저장소는 `--delete`가 업로드 이미지를 지운 적이 이미 있다 —
        #  2026-07-30 05:03 UTC에 실제로 2개가 지워졌고, watch.sh가 '원본 0개'를
        #  '확인할 것 없음'으로 찍어 12일간 아무도 몰랐다. 08-11에 버저닝으로 복구).
        # must-revalidate여도 엣지 캐시는 그대로 돌고 브라우저는 304 한 번이면 끝난다.
        # 방문자가 사실상 없는 블로그에서 그 차이보다 '배포가 반영되지 않는 위험'이 크다.
        #
        # 2026-08-17: 위 판단을 **뒤집지 않고** 위험한 부분만 뺐다. 문제였던 것은
        # '2-pass' 자체가 아니라 `--delete`가 --include/--exclude에 따라 범위가 갈리는 것이다.
        # 그래서 sync는 지금 그대로 한 번만 돌고(--delete 포함), 그 **뒤에** 해시가 박힌
        # 번들만 골라 **메타데이터만 바꾼다**(cp --metadata-directive REPLACE, --delete 없음).
        # 두 번째 패스는 무엇도 지울 수 없으므로 위 문단이 걱정한 사고가 구조적으로 안 난다.
        # 이름이 안 바뀌는 파일(html·sw.js·rss.xml…)은 손대지 않으니 '배포해도 옛것이 뜨는'
        # 위험도 그대로 없다 — 해시 파일은 내용이 바뀌면 **이름이 바뀐다**는 게 전제다.
        # ⚠️ content-type을 확장자별로 명시한다. REPLACE는 기존 메타데이터를 통째로
        # 갈아치우므로 안 주면 application/octet-stream이 되고, nosniff 때문에 스크립트가
        # 아예 실행되지 않는다(사이트가 백지가 된다).
        run: |
          aws s3 sync dist/ s3://blogplafromops --delete --exclude "uploads/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: CloudFront 캐시 무효화
        run: aws cloudfront create-invalidation --distribution-id E1438IL9CSVBS4 --paths "/*"

      # 해시 자산만 1년 immutable로 (지우지 않는 메타데이터 갱신).
      #
      # **무효화보다 뒤에 둔다.** 처음엔 sync와 같은 스텝에 붙였는데, 이 명령이 실패하자
      # (배포 역할에 s3:GetObject가 없었다 — CopyObject는 소스를 읽는다) `set -e`로 스텝이
      # 죽으면서 **무효화까지 건너뛰었다.** 부가 기능 하나가 배포의 마지막 단계를 인질로
      # 잡은 셈이다. 갈라두면 여기서 실패해도 배포는 이미 끝나 있고, 빨간불은 그대로 뜬다
      # (2026-08-17 — 사이트는 멀쩡하고 캐시 헤더만 안 바뀌어서 S3를 떠보고서야 알았다).
      - name: 해시 자산 캐시 계층 (immutable)
        run: |
          for spec in "js:application/javascript" "css:text/css"; do
            ext="${spec%%:*}"; ctype="${spec#*:}"
            aws s3 cp s3://blogplafromops s3://blogplafromops --recursive \
              --exclude "*" --include "*-????????.$ext" \
              --metadata-directive REPLACE --content-type "$ctype" \
              --cache-control "public,max-age=31536000,immutable" \
              --only-show-errors
          done
          # 실제로 붙었는지 여기서 잰다 — 조용히 안 도는 것을 한 번 겪었다.
          key=$(aws s3api list-objects-v2 --bucket blogplafromops \
            --query "Contents[?ends_with(Key, '.js')] | [?contains(Key, '-')] | [0].Key" --output text)
          cc=$(aws s3api head-object --bucket blogplafromops --key "$key" --query CacheControl --output text)
          echo "$key → $cc"
          case "$cc" in *immutable*) echo "캐시 계층 적용 확인" ;; *) echo "::error::캐시 계층이 안 붙었습니다 ($cc)"; exit 1 ;; esac
