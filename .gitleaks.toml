# gitleaks 설정 — 커밋에 시크릿이 섞여 들어가는 것을 CI에서 막는다.
#
# 왜 필요한가 — 2026-07-22에 `.env`가 도커 이미지에 구워진 채로 운영에 돌고 있었다.
# `.dockerignore`가 `.env`(정확 일치)만 걸러서 `.env.bak-…` 같은 사본이 통과한 것이다.
# 그때 깃 쪽도 같은 구멍이었고, 사람이 눈으로 보는 것으로 막고 있었다.
# **이미지보다 깃이 나쁘다 — 푸시하면 되돌릴 수 없다.**
#
# 아래 예외는 전부 2026-07-28에 하나씩 열어보고 판단한 것이다. 예외를 넣는 순간
# 그 자리는 영원히 안 보이게 되므로, 각 항목에 '왜 안전한가'를 남긴다.
# 판단 없이 예외를 늘리면 이 검사는 '영구 초록'이 되고, 그건 검사가 없는 것과 같다.

[extend]
useDefault = true

# ── 이 프로젝트가 실제로 쓰는 자격증명 규칙을 직접 넣는다 ──────────────────
# 기본 규칙만으로 충분한지 2026-07-28에 실측했다. 진짜처럼 생긴 고엔트로피 값 4종을
# 임시 클론에 커밋해 스캔한 결과:
#   ✅ GitHub PAT(ghp_…)            잡음
#   ✅ AWS 시크릿 액세스 키          잡음 (generic-api-key로)
#   ❌ AWS 액세스 키 ID(AKIA…)       **못 잡음**
#   ❌ Anthropic 키(sk-ant-api03-…)  **못 잡음**
# 못 잡은 둘이 하필 이 저장소가 실제로 쓰는 것들이다(.env의 ANTHROPIC_API_KEY,
# 06-25에 PROGRESS.md로 새어나간 그 AKIA). 기본값을 믿고 넘어갔으면 '초록인데
# 안 보는' 상태가 됐을 것이다.

[[rules]]
id = "anthropic-api-key-strict"
description = "Anthropic API 키 (이 앱의 AI 초안 기능이 쓴다)"
regex = '''sk-ant-[a-zA-Z0-9]{4,}-[a-zA-Z0-9_\-]{60,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "aws-access-key-id-strict"
description = "AWS 액세스 키 ID. 시크릿 키는 아니지만 계정·IAM 주체를 특정해준다"
regex = '''\b(?:AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16}\b'''
keywords = ["AKIA", "ASIA", "ABIA", "ACCA"]

[allowlist]
description = "실측으로 안전 판정한 항목들 (2026-07-28 감사)"

# ⚠️ 경로·정규식 모두 **앵커(^…$)를 붙인다.** gitleaks는 이것들을 부분일치로 본다
# (`regexp.MatchString`). 앵커 없이 쓰면 예외가 의도보다 훨씬 넓어진다 —
# 2026-07-28 심층검사에서 실제로 둘 다 그 상태였고, 아래 두 항목이 그 수정이다.
paths = [
  # Claude Code의 머신별 로컬 설정. 걸린 규칙은 curl-auth-header인데 실제 내용은
  # 인증 헤더가 아니라 **허용 명령 목록의 curl 한 줄**이다(오탐).
  # 히스토리에 있는 것은 이 둘뿐이고(git log --diff-filter=A로 확인), 이미 푸시돼
  # 되돌릴 수 없어서 경로로 뺀다.
  #
  # 전에는 `\.claude/settings\.local\.json.*` 였다. 그 `.*` 가 위험했다 —
  # Claude Code가 작업 중 만드는 `settings.local.json.tmp.<pid>.<hash>` 형제까지
  # 전부 덮는데, 그 형제들은 **gitignore에 안 걸려서 실제로 커밋된 적이 있다**
  # (07-22의 .tmp.3569.a44bb78d7e3f). 즉 시크릿이 들어가기 가장 쉬운 자리를 스캐너가
  # 안 보고 있었다. 2026-07-22 `.dockerignore`의 `.env` 사고와 똑같은 모양이다.
  # 지금은 **존재하는 두 파일만** 정확히 지목하고, .gitignore 쪽도 형제까지 막았다.
  '''^\.claude/settings\.local\.json$''',
  '''^\.claude/settings\.local\.json\.tmp\.3569\.a44bb78d7e3f$''',

  # ruff 캐시. 추적되지 않지만 로컬 스캔에서 conftest의 테스트값을 그대로 반사한다.
  '''^backend/\.ruff_cache/''',
]

regexes = [
  # 테스트·CI 전용 SECRET_KEY. 값이 코드/문서에 그대로 있는 게 **의도**다 —
  # 운영 키는 .env에만 있고, main.py의 lifespan 가드가 약한 키로는 아예 기동을 막는다.
  # (README의 pytest 실행 예시 · ci.yml의 env · tests/conftest.py)
  '''^test-secret-key-0123456789abcdef$''',
  '''^ci-secret-key-0123456789abcdef$''',

  # 2026-06-25 PROGRESS.md에 기록된 옛 배포용 IAM 액세스 키 **ID**(시크릿 키 아님).
  # 되돌릴 수 없는 히스토리라 예외로 둔다. 그전에 실제로 죽었는지 확인했다(07-28):
  #   - IAM 사용자 `github-actions-deploy` 자체가 없다(OIDC 역할로 대체됨: NoSuchEntity)
  #   - 계정의 모든 사용자 액세스 키를 훑어 이 ID가 0건임을 확인
  #   - 살아 있는 키 2개는 07-27 IR 훈련에서 로테이션된 것
  # 즉 '노출됐지만 죽은 식별자'다. 새 키가 커밋되면 이 값과 안 같으므로 잡힌다.
  '''^AKIASURS2YM7WKLL4SV3$''',

  # 토스페이먼츠 테스트 키 — **이 저장소에 실제로 있는 두 값만** 지목한다.
  #   backend/app/core/config.py:71    (서버 기본값 — 2026-08-11 정정, 46은 aws_region 줄이다)
  #   frontend/src/pages/PaymentPage.tsx:13 (클라이언트 폴백)
  # 전에는 `test_sk_[A-Za-z0-9]+` 였는데, 앵커가 없어 **값 안에 그 문자열이 들어가기만
  # 해도** 통과했다(고엔트로피 키 중간에 test_sk_ 를 넣은 실측으로 확인). 게다가 그
  # 패턴은 토스 대시보드에서 발급한 '그 상점의' 테스트 키까지 전부 덮는다 — 공개
  # 문서의 값과 다른, 진짜 자격증명인데도.
  # 라이브 키는 .env에만 있고 PAYMENTS_REQUIRE_LIVE=true가 test_ 키로의 승인을 막는다.
  '''^test_sk_zXLkKEypNArWmo50nX3lmeaxYG5R$''',
  '''^test_ck_D5GePWvyJnrK0W0k6q8gLzN97Eoq$''',

  # JWT 헤더 `{"typ":"JWT","alg":"ES256"}` 의 base64. **비밀이 아니라 상수다** —
  # ES256으로 서명하는 모든 JWT의 첫 마디가 이 값이고, 토큰의 서명·페이로드는
  # 뒤에 오는데 여기서는 `...` 로 잘려 있다(즉 이 문자열만으로는 아무것도 못 한다).
  # 걸린 자리: scripts/make_devlog_20260807.py:280 — 개발일지 #26이 Web Push의
  # `Authorization: vapid t=…` 헤더 모양을 증거로 인용한 대목이다(6aa075f).
  # 잡은 규칙은 generic-api-key(엔트로피 4.31). 이미 푸시된 히스토리라 파일을
  # 고쳐도 스캔에는 계속 남는다.
  # **값 전체를 앵커로 지목한다** — 접두사(`^eyJ…`)만 걸면 헤더가 같은 *진짜* 토큰이
  # 전부 통과한다. ES256 JWT는 전부 이 26자로 시작하므로 그게 정확히 위험한 경우다.
  '''^eyJ0eXAiOiJKV1QiLCJhbGciOiJFUzI1NiJ9\.\.\.$''',
]
