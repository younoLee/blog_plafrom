# 프로덕션(EC2) 스택. EC2 ~/blog/ 에 이 파일이 있고, .env(시크릿)는 깃 미포함.
# DB는 RDS가 아니라 이 compose의 db 컨테이너(pgdata 볼륨=EBS에 영구 저장).
# db 포트는 호스트에 노출하지 않는다 — backend가 compose 네트워크로 db:5432에 접속.
# 업로드 이미지는 **S3**(blogplafromops/uploads/)에 저장된다 — 2026-06-26 이전.
# 아래 uploads 볼륨은 남아 있는 폴백이며 운영 트래픽은 타지 않는다.
services:
  db:
    image: postgres:16-alpine
    # **메모리 상한 (2026-08-31 검사).** 두 컨테이너 다 상한이 없었고 호스트는 957MB에
    # 스왑 0이다. 상한이 없으면 메모리가 마를 때 **커널이 누구를 죽일지 고르고**, 그
    # 후보에 pgdata 를 쓰는 이쪽이 들어간다. 상한을 걸면 죽는 쪽이 '한도를 넘은 쪽'으로
    # 확정되고, 나중에 `docker inspect` 의 OOMKilled 로 사후 판독이 된다.
    #
    # 320m 은 실측(37MB)의 여덟 배가 아니라 shared_buffers 128MB + 작업 메모리 + 여유다.
    # backend 400m 과 합쳐 720m 으로, 호스트 957MB 안에서 OS 몫을 남긴다.
    mem_limit: 320m
    environment:
      POSTGRES_USER: postgres
      # 비번은 compose가 같은 폴더 .env의 DB_PASSWORD로 치환(컨테이너 내부 전용, 인터넷 비노출).
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    # backend와 같은 이유로 회전을 건다(아래 backend의 logging 주석 참고).
    # **이쪽이 더 급하다** — 아래 healthcheck가 5초마다 돌아 backend(30초)보다 6배 잦고,
    # 복원 훈련은 한 번에 `docker compose exec -T db psql`을 90회 넘게 붙였다 뗀다.
    # 그 로그 파일은 pgdata와 **같은 EBS 루트 볼륨**에 산다. backend에만 걸어둔 것은
    # 그 주석이 서술한 위험을 절반만 막고 있었다(2026-08-10 심층검사).
    #
    # ⚠️ 이 설정은 **컨테이너 생성 시점에 굳는다.** 이미 도는 컨테이너에는 적용되지 않으므로
    #    `docker compose up -d db`로 재생성해야 하고, 그때 옛 로그가 함께 사라진다.
    #    pgdata는 named volume이라 재생성에도 안전하다. 확인:
    #      sudo docker inspect -f '{{.HostConfig.LogConfig}}' blog-db-1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # backend가 'DB 준비 완료' 후에 뜨도록 상태 체크
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      # 5초였다. 이 주기가 필요한 이유는 backend의 `depends_on: service_healthy`뿐이고
      # 그건 **부팅 30초 동안만** 의미가 있다. 나머지 시간엔 하루 17,280회 pg_isready
      # 프로세스 생성 ≈ CPU 크레딧 4/일이다. 답은 이미 아래 backend 쪽에 있다 —
      # start_period + start_interval 조합이면 부팅은 더 빨라지고(2초 간격) 상시 비용은
      # 1/6이 된다. (2026-08-11 병목검사)
      interval: 30s
      start_period: 60s
      start_interval: 2s
      timeout: 3s
      retries: 5

  backend:
    build: .
    # 위 db 와 같은 이유. 실측 RSS 는 136MB인데 목록 요청이 본문을 파이썬 힙에 올리므로
    # 순간값이 튀는 쪽도 이쪽이다. 400m 은 그 세 배쯤이고, 넘으면 이 컨테이너만 죽는다
    # (restart: unless-stopped 라 곧 다시 뜬다 — 커널이 db 를 고르는 것보다 낫다).
    mem_limit: 400m
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    # 헬스체크가 30초마다 액세스 로그를 남긴다(하루 약 2,880줄). json-file 기본은
    # 무제한이고 이 디스크는 pgdata와 같은 EBS라, 회전을 안 걸면 DB와 로그가 같이 찬다.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 로컬 저장 폴백용 폴더. 실제 이미지는 S3에 있다
    # (여기를 '이미지의 집'으로 읽으면 안 된다 — 2026-07-22에 이 주석 때문에 오판했다).
    # 예전엔 "StaticFiles 마운트가 요구하는 폴더"이기도 했으나 2026-08-26부터 아니다 —
    # main.py가 폴더가 없으면 마운트를 건너뛴다. 이 바인드는 이제 폴백 저장소일 뿐이다.
    # dev(docker-compose.yml)는 명명 볼륨을 쓴다. 여기만 바인드인 이유는 EC2의 EBS에
    # 파일을 남겨 보고 싶어서고, 운영 트래픽은 S3라 이 경로를 타지 않는다.
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy   # DB 준비될 때까지 대기
    # 백엔드에도 상태 체크. db에는 있는데 여기엔 없어서, 프로세스는 살아 있는데
    # 응답만 못 하는 상태를 `docker compose ps`로도 알 수 없었다.
    #
    # ⚠️ 오해 금지: 이건 **가시성**이지 자동 복구가 아니다. plain Compose는
    # unhealthy를 이유로 재시작하지 않는다(그건 Swarm/ECS의 몫). 실제 복구는
    # 아직 사람이 하고, 감지는 scripts/watch.sh가 바깥에서 한다.
    # ECS로 옮길 때 이 정의가 그대로 태스크 헬스체크가 된다.
    #
    # curl은 python:3.12-slim에 없다 → 표준 라이브러리로 때린다.
    # 경로는 /api/health다. /health는 404이므로 그걸 쓰면 100% 실패한다.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # start_period 동안에는 실패를 세지 않는다. start_interval을 같이 주면 그 구간에서
      # 5초마다 찔러 **성공하는 순간 바로 healthy**가 되므로, start_period를 넉넉히 잡아도
      # 손해가 없다. 이게 없으면 "빨리 healthy"와 "늦게 실패 판정"을 한 노브로 맞바꾸게 된다.
      # (빈 DB로 부팅하는 재해 복구 때는 마이그레이션 27개 + GIN 인덱스가 60초를 넘길 수 있다)
      start_period: 120s
      start_interval: 5s
    # --limit-concurrency 는 이름과 달리 **열린 TCP 연결 수** 상한이다. 처리 중인 요청이
    # 아니다 — uvicorn 은 `len(self.connections) >= limit` 로 검사하고, connections 는
    # connection_made 에서 늘고 connection_lost 에서만 준다(httptools_impl.py). 즉 요청을
    # 안 보내고 keep-alive 로 놀고 있는 연결도 정원을 먹는다.
    #
    # 그래서 40은 위험했다(2026-08-26에 넣었다가 같은 날 고쳤다). 브라우저는 오리진당
    # 소켓을 6개까지 열고 CloudFront 도 오리진 연결을 유지하므로 **동시 방문자 7명이면**
    # 정원이 찬다. 넘으면 헬스체크를 포함한 모든 요청이 503을 받는데, 그건 uvicorn 이
    # 앱 바깥에서 내는 text/plain 이라 main.py 의 예외 핸들러를 타지 않는다 — 프론트가
    # 파싱조차 못 하는 바로 그 실패 모양이다.
    #
    # 그래서 여기서는 '큐가 무한히 자라는 것'만 막는 큰 값을 둔다. CPU 예산은 이 옵션이
    # 아니라 앱 레벨에서 지킨다 — routers/auth.py 의 bcrypt 동시성 상한과 레이트리밋이다.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --limit-concurrency 500"

volumes:
  pgdata:
