# 타입 검사. **2026-08-11 정적 분석에서 처음 돌렸고, 그 한 번에 진짜 결함 둘을 찾았다:**
#   · routers/subscriptions.py — `db.get()`이 None을 줄 수 있는데 `.display_name`을
#     바로 읽어 500이 나는 경로(FK가 CASCADE라 창은 좁지만 실재한다)
#   · routers/ai.py — `_resolve_provider`의 반환 타입이 `tuple[str, str]`인데
#     실제로는 `str | None`을 담아 돌려주던 것(**시그니처가 거짓말**)
# 둘 다 pytest 300개와 ruff가 못 잡았다. 타입은 "실행되지 않은 경로"를 보기 때문이다.
#
# 왜 이 설정인가 — ruff.toml과 같은 방침이다: **켜기만 하고 안 잡히면 무의미**하므로
# 노이즈를 먼저 0으로 만들고 게이트로 세운다. 처음 19건이었고 그중 14건이
# `OpenAI(**kwargs)`의 오버로드 해석 실패였다(dict 타입을 명시해 없앴다).
# 남은 것은 아래 per-module로 좁혀 끈다 — 전부 프레임워크/SDK 관용구이고
# 런타임에서 정상 동작하는 것들이라 우리 코드의 결함이 아니다.
#
# tests/·scripts/를 제외하는 이유: 픽스처와 일회성 스크립트는 타입이 느슨한 게 정상이고,
# 여기 목적은 '앱 코드의 거짓 시그니처'를 잡는 것이다.
[mypy]
python_version = 3.12
ignore_missing_imports = True
check_untyped_defs = False
exclude = (?x)(^alembic/|^tests/|^scripts/)

# --- 아래는 '우리 코드 결함이 아님'을 하나씩 확인하고 끈 것 ---

# SQLAlchemy 2.0의 `session.execute(delete(...))`는 런타임에 CursorResult를 주지만
# 스텁은 Result[Any]로 좁힌다. `.rowcount`는 실제로 존재하고 테스트가 값을 검증한다.
[mypy-app.services.cleanup]
disable_error_code = attr-defined

# `show max_connections`의 `.scalar()`가 Any|None인데 int()로 감싼다.
# 바로 아래 `except Exception`이 받아 {"connections": None}으로 떨어지는 의도된 처리다.
[mypy-app.routers.admin]
disable_error_code = arg-type

# cohere SDK가 messages에 TypedDict 계열을 요구하지만 dict 리터럴로 넘긴다(런타임 정상).
[mypy-app.services.ai]
disable_error_code = list-item

# slowapi 핸들러 시그니처가 Starlette의 반공변 타입과 안 맞는다. 프레임워크 관용구.
[mypy-app.main]
disable_error_code = arg-type
